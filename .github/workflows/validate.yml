name: Validate backup integration files
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n scripts/rapelz-backup-agent.sh
      - name: Validate JSON configuration example
        run: python3 -m json.tool config/rapelz-backup.example.json >/dev/null
      - name: Check required safety guards
        run: |
          grep -q 'flock -n' scripts/rapelz-backup-agent.sh
          grep -q 'age -r' scripts/rapelz-backup-agent.sh
          grep -q 'remote_size.*cipher_size' scripts/rapelz-backup-agent.sh
          grep -q 'retention_requires_verified_success' config/rapelz-backup.example.json
          test -s docs/RECOVERY-RUNBOOK.md
          test -s docs/ARCHITECTURE.md
